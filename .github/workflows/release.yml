name: Build Windows installer

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run make
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-Item dist/Tomas-Fight-Setup.exe
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii dist/Tomas-Fight-Setup.exe.sha256
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Tomas-Fight-Setup.exe
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Tomas-Fight-Setup.exe
            dist/Tomas-Fight-Setup.exe.sha256
