<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080b13"><title>SHATTER ARENA</title><link rel="stylesheet" href="/style.css"></head>
<body><main id="app">
  <section id="lobby" class="lobby"><div class="brand"><span class="brand-mark">✳</span><span>SHATTER <b>ARENA</b></span><small>ONLINE COMBAT / 01</small></div><div class="lobby-copy"><p class="eyebrow">SELECT YOUR FIGHTER</p><h1>誰で、<em>戦う？</em></h1><p class="sub">モデルを選んでアリーナへ。友達と部屋コードを共有しよう。</p></div>
  <div id="cards" class="cards"></div><div class="joinbar"><label>プレイヤー名<input id="playerName" maxlength="16" value="PLAYER" autocomplete="nickname"></label><label>部屋コード<input id="roomCode" maxlength="12" value="ARENA" autocomplete="off"></label><button id="joinBtn" class="join">アリーナに入る <span>→</span></button></div><div class="lobby-foot"><span>● SERVER READY</span><span>最大 12 PLAYERS</span><span>WASD 移動 · マウス 照準 · クリック 射撃</span></div></section>
  <section id="game" class="game hidden"><canvas id="world"></canvas><div class="hud-top"><div class="hud-logo">✳ SHATTER <b>ARENA</b></div><div class="room-pill">ROOM <b id="roomLabel">ARENA</b><button id="copyRoom" title="部屋コードをコピー">⧉</button></div><button id="leaveBtn" class="leave">退出 ↗</button></div><div class="hud-bottom"><div class="health"><span>VITALS</span><div class="health-track"><i id="healthBar"></i></div><b id="healthText">100</b></div><div class="scorebox"><span>ELIMINATIONS</span><b id="scoreText">00</b></div><div class="hint">W A S D　MOVE <i>·</i>　MOUSE　AIM <i>·</i>　CLICK　FIRE</div></div><div id="playerList" class="player-list"></div><div id="toast" class="toast"></div><div id="crosshair" class="crosshair">+</div></section>
  <div id="loading" class="loading hidden"><div class="spinner"></div><span>アリーナを準備中...</span></div>
  <aside id="updateBanner" class="update-banner hidden"><span id="updateMessage">更新が来てます。アップデートしてください。</span><button id="updateButton" class="update-action">アップデートする</button><button id="dismissUpdate" aria-label="閉じる">×</button></aside>
</main><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script src="/socket.io/socket.io.js"></script><script type="module" src="/game.js"></script></body></html>
